; DIAGNOSTIC ONLY. Not installed automatically.
; Start from your existing UE4SS-settings.ini and compare these reductions.
; This profile cannot fix the d935b5b core DLL-loading behavior.

[General]
EnableHotReloadSystem = 0
UseCache = 1
InvalidateCacheIfDLLDiffers = 1
SecondsToScanBeforeGivingUp = 30
bUseUObjectArrayCache = false

[Debug]
ConsoleEnabled = 0
GuiConsoleEnabled = 0
GuiConsoleVisible = 0
GraphicsAPI = opengl

[Hooks]
HookProcessInternal = 1
HookProcessLocalScriptFunction = 0
HookInitGameState = 0
HookCallFunctionByNameWithArguments = 0
HookBeginPlay = 0
HookLocalPlayerExec = 0
FExecVTableOffsetInLocalPlayer = 0x28

[ExperimentalFeatures]
GUIUFunctionCaller = 0

[CrashDump]
EnableDumping = 1
FullMemoryDump = 0
